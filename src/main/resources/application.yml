server:
  port: 8084
  servlet:
    context-path: /api/

spring:
    application:
        name: deposit-service
    datasource:
        url: jdbc:postgresql://localhost:5432/deposit-service
        username: postgres
        password: postgres
        driver-class-name: org.postgresql.Driver
    jpa:
        hibernate:
            ddl-auto: none

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
      